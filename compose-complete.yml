services:

  notes-ui:
    image: ghcr.io/marcelloraffaele/notes-ui:main
    ports:
      - "8081:80"
    environment:
      REACT_APP_API_URL: "http://localhost:8080"
    depends_on:
      notes-api:
        condition: service_healthy

  notes-api:
    image: ghcr.io/marcelloraffaele/notes-api:latest
    ports:
      - "8080:8080"
    environment:
      NOTES_STORAGE: "postgres"
      NOTES_DB_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB:-notes}"
      POSTGRES_USER: ${POSTGRES_USER:-notes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for local development}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/v3/api-docs || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: notes
      POSTGRES_USER: ${POSTGRES_USER:-notes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for local development}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - notes-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/001-notes.sql:/docker-entrypoint-initdb.d/001-notes.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  
  pgadmin:
    image: dpage/pgadmin4:9
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - notes-pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  notes-postgres-data:
  notes-pgadmin-data:
