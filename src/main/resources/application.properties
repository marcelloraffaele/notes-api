spring.application.name=note-api

# Logging configuration for security monitoring
logging.level.com.rmarcello.note.controller=INFO
logging.level.com.rmarcello.note.exception.GlobalExceptionHandler=WARN
logging.level.com.rmarcello.note.filter.RateLimitingFilter=WARN
logging.level.org.springframework.security=WARN

# Server configuration for security
server.error.include-stacktrace=never
server.error.include-message=never
